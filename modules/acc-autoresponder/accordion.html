<div class="wppoppop-auto-root">
    <div class="wppoppop-auto-check"><label class="wppoppop-toggle-switch"><input type="checkbox" id="set-auto-enable" value="1"><span class="wppoppop-toggle-slider"></span></label><label for="set-auto-enable">Send Welcome Email</label></div>
    <div class="wppoppop-auto-lblrow wppoppop-auto-hastag"><label class="wppoppop-auto-lbl" for="set-auto-subject">Email Subject</label></div>
    <input type="text" id="set-auto-subject" class="widefat" placeholder="Welcome! Here is your reward">
    <div class="wppoppop-auto-lblrow wppoppop-auto-hastag"><label class="wppoppop-auto-lbl" for="set-auto-body">Message</label></div>
    <textarea id="set-auto-body" rows="4" class="widefat" placeholder="Thank you for subscribing!"></textarea>
    <p class="description wppoppop-auto-help">Use the tag button to insert the subscriber's values, for example {{email}} or {{field-name}} (the older {email} form still works). Sent to the visitor's email after a successful submit; with Double Opt-In, once the link is confirmed.</p>
</div>
